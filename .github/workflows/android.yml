name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      play_id:
        description: 'Build with the Google Play app id com.robotrainerpro.app (Play billing on)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        env:
          RT_APP_ID: ${{ inputs.play_id && 'com.robotrainerpro.app' || '' }}
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk robotrainer-test.apk
      - uses: actions/upload-artifact@v5
        with:
          name: robotrainer-debug-apk
          path: robotrainer-test.apk
      # Test build as a GitHub release: easy to download straight to a phone
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" robotrainer-test.apk \
            --title "Тестовая сборка ${{ github.run_number }}" \
            --notes "Файл для проверки на Android-телефоне. Не для магазина." \
            --prerelease=false --latest
