name: iOS App Store status

# Read-only: prints the review state of the app version, review submissions
# and the Level 1 subscription.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/asc/status.py
      - .github/workflows/ios-status.yml

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyjwt cryptography
      - name: Status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/key.p8" python3 .github/asc/status.py
          rm -f "$RUNNER_TEMP/key.p8"
