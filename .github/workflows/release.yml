name: Store release APK

# Signed APK for RuStore and AAB for Google Play. Runs when a tag like v1.0.0 is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Restore release key from secrets
        env:
          KEY_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "Secret RELEASE_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK and AAB
        working-directory: android
        env:
          RT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk robotrainer.apk
          cp android/app/build/outputs/bundle/release/app-release.aab robotrainer.aab
      - name: Publish store release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="store-${{ github.run_number }}";; esac
          gh release create "$TAG" robotrainer.apk robotrainer.aab \
            --title "Для магазина $TAG" \
            --notes "robotrainer.apk для RuStore, robotrainer.aab для Google Play." \
            --latest=false
